name: Build & Release

on:
  push:
    branches: [ main, 'kursus*' ]
  pull_request:
    branches: [ main, 'kursus*' ]

permissions:
  contents: read

jobs:
  validate:
    name: Build, Analyzers & Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build game and tests with analyzers
        run: dotnet build tests/Pong.Tests/Pong.Tests.csproj --configuration Release --no-incremental -warnaserror -p:RunAnalyzersDuringBuild=true

      - name: Run tests
        run: dotnet test tests/Pong.Tests/Pong.Tests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.rid }})
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer
          fc-cache -f

      - name: Publish
        run: |
          dotnet publish Pong.csproj \
            --configuration Release \
            -warnaserror \
            -p:RunAnalyzersDuringBuild=true \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            /p:PublishSingleFile=true \
            --output publish/${{ matrix.rid }}

      - name: Zip artifact
        run: zip -j pong-${{ matrix.rid }}.zip publish/${{ matrix.rid }}/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pong-${{ matrix.rid }}
          path: pong-${{ matrix.rid }}.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: artifacts/**/*.zip
